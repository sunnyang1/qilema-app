# 生产环境覆盖配置
# 使用: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 特性:
# - 严格的资源限制
# - 高可用性配置
# - 持久化存储
# - 最小化日志输出
# - 自动重启

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qilema_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      LOG_LEVEL: WARNING
    volumes:
      - ./backend/logs:/app/logs
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Phase 3: 通知 Worker（2 个副本处理 SOS/通知事件）
  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      LOG_LEVEL: WARNING
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_ID: ${WORKER_ID:-notification-worker-1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: python -m workers.notification_worker
    networks:
      - qilema_network

  # Phase 3: 签到调度 Worker（单实例避免重复调度）
  checkin-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_ID: ${WORKER_ID:-checkin-scheduler-1}
      CHECKIN_SCAN_INTERVAL: "60"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    command: python -m workers.checkin_scheduler
    networks:
      - qilema_network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  qilema_network:
    driver: bridge
