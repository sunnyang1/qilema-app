version: '3.8'

services:
  # PostgreSQL 生产环境覆盖配置
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qilema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qilema_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups  # 备份目录
    
    # 生产环境添加资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis 生产环境覆盖配置
  redis:
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    
    # 生产环境添加资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 后端API服务覆盖配置（生产环境）
  backend:
    environment:
      # 应用配置
      ENVIRONMENT: production
      DEBUG: "False"
      APP_NAME: "起了吗App"
      APP_VERSION: "1.0.0"
      
      # 数据库配置（从环境变量读取）
      DATABASE_URL: ${DATABASE_URL:-postgresql://qilema:qilema_password@postgres:5432/qilema_prod}
      
      # Redis配置（从环境变量读取）
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      
      # JWT配置（必须从环境变量设置）
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # 加密密钥（必须从环境变量设置）
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # CORS配置（生产环境仅允许指定域名）
      CORS_ORIGINS: ${CORS_ORIGINS}
      
      # 签到配置
      DEFAULT_CHECKIN_HOURS: 24
      
      # 日志级别
      LOG_LEVEL: WARNING
    
    # 生产环境不挂载源码，使用打包后的镜像
    volumes:
      - ./backend/logs:/app/logs
    
    # 生产环境设置资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    restart: always
    
    # 生产环境更严格的健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
