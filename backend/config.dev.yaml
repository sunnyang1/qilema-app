# 起了吗App - 开发环境配置
# 使用方式：python -m uvicorn app.main:app --reload --env-file .env.dev

# 环境配置
environment: development
debug: true

# 应用配置
app:
  name: "起了吗App"
  version: "1.0.0"

# 数据库配置
database:
  url: "sqlite:///./qilema_dev.db"
  echo: true  # 开发环境打印SQL语句
  pool_size: 5
  max_overflow: 10
  pool_recycle: 3600

# Redis配置
redis:
  url: "redis://localhost:6379/0"

# API配置
api:
  v1_prefix: "/api/v1"

# 日志配置
logging:
  level: "DEBUG"
  format: "%(asctime)s | %(levelname)s | %(request_id)s | %(user_id)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  dir: "logs"
  file_max_bytes: 10485760  # 10MB
  file_backup_count: 5
  to_console: true
  to_file: true

# CORS配置
cors:
  origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://localhost:5173"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
    - "Accept"
    - "Origin"

# JWT配置
jwt:
  algorithm: "HS256"
  access_token_expire_minutes: 30

# 签到配置
checkin:
  default_hours: 24

# 紧急求助配置
sos:
  contact_notify_channels:
    - "push"
    - "sms"

# 通知服务配置
notification:
  push:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 3
    retry_interval_ms: 1000
  sms:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 3
    retry_interval_ms: 1000
  phone:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 3
    retry_interval_ms: 1000
  email:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 3
    retry_interval_ms: 1000
  degradation:
    enabled: true
    channel_priority:
      - "phone"
      - "sms"
      - "push"
      - "email"
