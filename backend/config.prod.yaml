# 起了吗App - 生产环境配置
# 使用方式：python -m uvicorn app.main:app --env-file .env.prod

# 环境配置
environment: production
debug: false

# 应用配置
app:
  name: "起了吗App"
  version: "1.0.0"

# 数据库配置
database:
  url: "${DATABASE_URL}"  # 从环境变量读取
  echo: false  # 生产环境不打印SQL
  pool_size: 20  # 生产环境增大连接池
  max_overflow: 40
  pool_recycle: 3600

# Redis配置
redis:
  url: "${REDIS_URL}"  # 从环境变量读取

# API配置
api:
  v1_prefix: "/api/v1"

# 日志配置
logging:
  level: "WARNING"  # 生产环境只记录WARNING及以上级别
  format: "%(asctime)s | %(levelname)s | %(request_id)s | %(user_id)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  dir: "logs"
  file_max_bytes: 52428800  # 50MB
  file_backup_count: 30
  to_console: false  # 生产环境不输出到控制台
  to_file: true

# CORS配置
cors:
  origins:
    - "https://www.example.com"
    - "https://app.example.com"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
    - "Accept"
    - "Origin"

# JWT配置
jwt:
  algorithm: "HS256"
  access_token_expire_minutes: 30

# 签到配置
checkin:
  default_hours: 24

# 紧急求助配置
sos:
  contact_notify_channels:
    - "push"
    - "sms"
    - "phone"

# 通知服务配置
notification:
  push:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 5  # 生产环境增加重试次数
    retry_interval_ms: 2000
  sms:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 5
    retry_interval_ms: 2000
  phone:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 5
    retry_interval_ms: 2000
  email:
    enabled: true
    success_rate: 100.0
    delay_ms: 0
    max_retries: 5
    retry_interval_ms: 2000
  degradation:
    enabled: true
    channel_priority:
      - "phone"  # 生产环境优先级：电话 > 短信 > 推送 > 邮件
      - "sms"
      - "push"
      - "email"
