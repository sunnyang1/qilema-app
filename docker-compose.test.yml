# 测试环境覆盖配置
# 使用: docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# 特性:
# - 隔离的数据库
# - 快速失败的健康检查
# - 中等资源限制

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qilema_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      POSTGRES_DB: ${POSTGRES_DB:-qilema_test}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  backend:
    environment:
      ENVIRONMENT: testing
      DEBUG: "True"
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
