version: '3.8'

# 多环境配置说明：
# 开发环境：docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# 测试环境：docker-compose -f docker-compose.yml -f docker-compose.staging.yml up
# 生产环境：docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # 后端API服务覆盖配置（开发环境）
  backend:
    environment:
      # 应用配置
      ENVIRONMENT: development
      DEBUG: "True"
      APP_NAME: "起了吗App"
      APP_VERSION: "1.0.0"

      # 数据库配置
      DATABASE_URL: postgresql://qilema:qilema_dev_password@postgres:5432/qilema_dev

      # Redis配置
      REDIS_URL: redis://redis:6379/0

      # JWT配置
      SECRET_KEY: ${SECRET_KEY:-test_secret_key_at_least_64_bytes_long_for_testing_purposes_only_do_not_use_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # 加密密钥（开发环境可空）
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-test_encryption_key_32_bytes_long}

      # CORS配置
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost:5173"

      # 签到配置
      DEFAULT_CHECKIN_HOURS: 24

      # 日志级别
      LOG_LEVEL: DEBUG

    # 开发环境使用不同的端口
    ports:
      - "8000:8000"

    # 开发环境挂载源码以支持热重载
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs

    # 开发环境不设置重启策略
    restart: "no"

    # 开发环境使用更宽松的健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

    # 开发环境资源限制（相对宽松）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL数据库覆盖配置（开发环境）
  postgres:
    environment:
      POSTGRES_PASSWORD: qilema_dev_password
      POSTGRES_DB: qilema_dev

    # 开发环境资源限制（相对宽松）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Redis缓存覆盖配置（开发环境）
  redis:
    # 开发环境资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Nginx代理服务器覆盖配置（开发环境）
  nginx:
    # 开发环境不使用资源限制
    deploy: {}
