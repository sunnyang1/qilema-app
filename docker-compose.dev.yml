# 开发环境配置
# 使用: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 特性:
# - 热重载: 挂载源码目录
# - 详细日志: DEBUG 级别
# - 宽松资源限制
# - 不自动重启

services:
  backend:
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      APP_NAME: "起了吗App"
      APP_VERSION: "1.0.0"
      DATABASE_URL: postgresql://qilema:qilema_dev_password@postgres:5432/qilema_dev
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-test_secret_key_at_least_64_bytes_long_for_testing_purposes_only_do_not_use_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-test_encryption_key_32_bytes_long}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost:5173"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    restart: "no"
    develop:
      watch:
        - path: ./backend
          action: rebuild
          target: /app
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  postgres:
    environment:
      POSTGRES_PASSWORD: qilema_dev_password
      POSTGRES_DB: qilema_dev
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    deploy: {}
