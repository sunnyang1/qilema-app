name: qilema_app
description: "起了吗App - 独居人群紧急医疗服务平台"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^3.2.1
  
  # 网络请求
  dio: ^5.8.0
  
  # 路由
  go_router: ^17.1.0
  
  # URL启动器
  url_launcher: ^6.3.1
  
  # 本地存储
  shared_preferences: ^2.5.2
  
  # 地图
  amap_flutter_map: ^3.0.0
  
  # 权限管理
  permission_handler: ^12.0.1
  
  # 定位
  geolocator: ^14.0.2
  
  # 本地通知
  flutter_local_notifications: ^20.0.0
  
  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI组件
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  
  # 图表
  fl_chart: ^1.1.1
  
  # 蓝牙设备连接
  flutter_blue_plus: ^2.1.0
  
  # 分享功能
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
