version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: qilema-postgres
    environment:
      POSTGRES_USER: qilema
      POSTGRES_PASSWORD: qilema_password
      POSTGRES_DB: qilema
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qilema -d qilema"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qilema-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: qilema-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qilema-network

  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qilema-backend
    environment:
      # 应用配置
      ENVIRONMENT: production
      DEBUG: "False"
      APP_NAME: "起了吗App"
      APP_VERSION: "1.0.0"
      
      # 数据库配置
      DATABASE_URL: postgresql://qilema:qilema_password@postgres:5432/qilema
      
      # Redis配置
      REDIS_URL: redis://redis:6379/0
      
      # JWT配置（生产环境请修改为强随机密钥）
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # 加密密钥（必需）
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      
      # CORS配置
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
      
      # 签到配置
      DEFAULT_CHECKIN_HOURS: 24
      
      # 日志级别
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - qilema-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: qilema-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - qilema-network
    profiles:
      - with-nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  qilema-network:
    driver: bridge
