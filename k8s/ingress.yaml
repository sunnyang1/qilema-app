apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qilema-ingress
  namespace: qilema
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - qilema.example.com
    secretName: qilema-tls
  rules:
  - host: qilema.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 80
