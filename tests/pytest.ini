[pytest]
# Python路径配置
pythonpath = .

# 测试文件搜索路径
testpaths = tests

# 测试文件命名模式
python_files = test_*.py

# 测试类命名模式
python_classes = Test*

# 测试函数命名模式
python_functions = test_*

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 测试标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    regression: 回归测试
