version: '3.8'

services:
  # PostgreSQL 测试环境覆盖配置
  postgres:
    environment:
      POSTGRES_USER: qilema_staging
      POSTGRES_PASSWORD: qilema_staging_password
      POSTGRES_DB: qilema_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 使用不同的端口

    # Staging 环境资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Redis 测试环境覆盖配置
  redis:
    command: redis-server --appendonly yes
    volumes:
      - redis_staging_data:/data
    ports:
      - "6380:6379"  # 使用不同的端口

    # Staging 环境资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # 后端API服务覆盖配置（测试环境）
  backend:
    environment:
      # 应用配置
      ENVIRONMENT: testing
      DEBUG: "False"
      APP_NAME: "起了吗App (Staging)"
      APP_VERSION: "1.0.0"

      # 数据库配置
      DATABASE_URL: postgresql://qilema_staging:qilema_staging_password@postgres:5432/qilema_staging

      # Redis配置
      REDIS_URL: redis://redis:6379/1

      # JWT配置
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # 加密密钥
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # CORS配置
      CORS_ORIGINS: "http://staging.example.com,https://staging.example.com"

      # 签到配置
      DEFAULT_CHECKIN_HOURS: 24

      # 日志级别
      LOG_LEVEL: INFO

    # 测试环境使用不同的端口
    ports:
      - "8001:8000"

    volumes:
      - ./backend/logs:/app/logs

    restart: on-failure

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Staging 环境资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
