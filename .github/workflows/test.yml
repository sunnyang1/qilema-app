name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 并发控制：防止多个 workflow 同时运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 超时设置

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qilema
          POSTGRES_PASSWORD: qilema_test_password
          POSTGRES_DB: qilema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip packages
      uses: actions/cache@v4  # 升级: v3 -> v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-env

    - name: Run linting
      run: |
        cd backend
        pip install black flake8 mypy
        black --check .
        # 严格检查致命错误
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # 宽松检查其他问题，不阻止构建
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run type checking
      run: |
        cd backend
        pip install mypy
        # 类型检查不阻止构建，仅记录问题
        mypy app/ --ignore-missing-imports --no-error-summary --show-error-codes || echo "Type checking completed with warnings"

    - name: Run tests with coverage
      env:
        SECRET_KEY: test_secret_key_at_least_64_bytes_long_for_testing_purposes_only_do_not_use_in_production
        DATABASE_URL: postgresql://qilema:qilema_test_password@localhost:5432/qilema_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4  # 升级: v3 -> v4
      with:
        files: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false  # 上传失败不阻止构建
        verbose: true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: backend/htmlcov/
        retention-days: 7  # 保留 7 天
