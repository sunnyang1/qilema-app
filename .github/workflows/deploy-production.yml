name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/qilema-backend
  NGINX_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/qilema-nginx
  COMPOSE_PROJECT_NAME: qilema_prod

concurrency:
  group: deployment-production
  cancel-in-progress: false

jobs:
  pre-deployment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.tag }}
      backup-id: ${{ steps.backup.outputs.id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=${{ github.event.inputs.version }}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying version: $TAG"

      - name: Verify Docker images exist
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          docker pull ${{ env.NGINX_IMAGE }}:${{ steps.version.outputs.tag }}
          echo "✅ Docker images verified"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.PROD_SERVER_HOST }}

      - name: Create pre-deployment backup
        id: backup
        run: |
          BACKUP_ID=$(date +%Y%m%d_%H%M%S)
          echo "id=$BACKUP_ID" >> $GITHUB_OUTPUT
          
          ssh ${{ secrets.PROD_DEPLOY_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          set -e
          BACKUP_ID=$(date +%Y%m%d_%H%M%S)
          BACKUP_PATH="/backups/pre-deploy-${BACKUP_ID}"
          mkdir -p $BACKUP_PATH
          
          cd ${{ secrets.PROD_APP_PATH }}
          
          # Backup database
          docker-compose exec -T postgres pg_dump -U qilema qilema_prod | gzip > $BACKUP_PATH/database.sql.gz
          echo "✅ Database backup created"
          
          # Backup volumes
          docker run --rm -v qilema_prod_postgres_data:/data -v $BACKUP_PATH:/backup alpine tar czf /backup/postgres-volume.tar.gz -C /data .
          echo "✅ Volume backup created"
          EOF

      - name: Notify deployment start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 Starting Production Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Starting*\n*Version:* ${{ steps.version.outputs.tag }}\n*Backup ID:* ${{ steps.backup.outputs.id }}\n*Status:* Pre-deployment checks passed"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: pre-deployment-checks
    environment:
      name: production
      url: https://api.qilema.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.PROD_SERVER_HOST }}

      - name: Deploy application
        run: |
          ssh ${{ secrets.PROD_DEPLOY_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          set -e
          
          VERSION=${{ needs.pre-deployment-checks.outputs.version }}
          echo "Deploying version: $VERSION"
          
          # Pull latest code
          cd ${{ secrets.PROD_APP_PATH }}
          git fetch origin
          git checkout tags/$VERSION
          
          # Load environment
          export $(cat .env.prod | xargs)
          
          # Blue-green deployment
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull
          
          # Start new containers (blue environment)
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres redis
          sleep 5
          
          # Run migrations
          docker-compose exec -T backend python -m alembic upgrade head
          
          # Deploy new backend and nginx
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d backend nginx
          
          # Wait for services
          sleep 15
          
          # Health check
          for i in {1..30}; do
            if docker-compose exec -T backend curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Backend healthy"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          # Final verification
          curl -f http://localhost:8000/health || exit 1
          echo "✅ Production deployment successful"
          EOF

      - name: Run smoke tests
        run: |
          sleep 5
          
          # Test main endpoints
          curl -f https://api.qilema.com/health || exit 1
          curl -f https://api.qilema.com/v1/check-in || exit 1
          
          echo "✅ Smoke tests passed"

      - name: Verify all services
        run: |
          ssh ${{ secrets.PROD_DEPLOY_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.PROD_APP_PATH }}
          
          echo "Verifying services..."
          docker-compose ps
          docker-compose exec -T postgres pg_isready
          docker-compose exec -T redis redis-cli ping
          
          echo "✅ All services verified"
          EOF

      - name: Cleanup old containers
        run: |
          ssh ${{ secrets.PROD_DEPLOY_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          cd ${{ secrets.PROD_APP_PATH }}
          docker system prune -f --volumes
          EOF

      - name: Create post-deployment backup
        run: |
          ssh ${{ secrets.PROD_DEPLOY_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          set -e
          BACKUP_PATH="/backups/post-deploy-$(date +%Y%m%d_%H%M%S)"
          mkdir -p $BACKUP_PATH
          
          cd ${{ secrets.PROD_APP_PATH }}
          docker-compose exec -T postgres pg_dump -U qilema qilema_prod | gzip > $BACKUP_PATH/database.sql.gz
          
          echo "✅ Post-deployment backup created"
          EOF

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Production Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deploy Success*\n*Version:* ${{ needs.pre-deployment-checks.outputs.version }}\n*URL:* https://api.qilema.com\n*Status:* Live"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  rollback-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deployment-checks, deploy-production]
    if: failure() && needs.deploy-production.result == 'failure'
    environment:
      name: production

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.PROD_SERVER_HOST }}

      - name: Execute rollback
        run: |
          ssh ${{ secrets.PROD_DEPLOY_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
          set -e
          
          BACKUP_ID=${{ needs.pre-deployment-checks.outputs.backup-id }}
          BACKUP_PATH="/backups/pre-deploy-${BACKUP_ID}"
          
          echo "Rolling back to backup: $BACKUP_ID"
          
          cd ${{ secrets.PROD_APP_PATH }}
          
          # Stop current containers
          docker-compose down
          
          # Restore database
          gunzip < $BACKUP_PATH/database.sql.gz | docker-compose exec -T postgres psql -U qilema
          
          # Start services
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          
          # Wait and verify
          sleep 10
          
          # Health check after rollback
          for i in {1..30}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Service recovered after rollback"
              exit 0
            fi
            echo "Waiting for recovery... ($i/30)"
            sleep 2
          done
          
          echo "❌ Rollback recovery failed"
          exit 1
          EOF

      - name: Notify rollback
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "⚠️ Production Rollback Executed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Rollback*\n*Version:* ${{ needs.pre-deployment-checks.outputs.version }}\n*Backup ID:* ${{ needs.pre-deployment-checks.outputs.backup-id }}\n*Status:* Rolled back to previous state"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
