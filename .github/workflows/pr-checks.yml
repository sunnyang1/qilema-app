name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # Note: Dependency review requires GitHub Advanced Security or public repo with Dependency graph enabled
  # See: https://github.com/sunnyang1/qilema-app/settings/security_analysis
  # dependency-review:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   permissions:
  #     contents: read
  #     security-events: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Dependency review
  #       uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: high
  #         comment-summary-in-pr: true
  #         allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0, Unlicense

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python security check
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          cd backend
          pip install safety
          safety check -r requirements.txt --full-report || true
