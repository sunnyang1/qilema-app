name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 并发控制：防止多个构建同时运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU for multi-arch
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: qilema/backend
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push backend Docker image
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: BUILDKIT_INLINE_CACHE=1
        provenance: mode=max
        sbom: true

    - name: Validate Nginx config
      run: |
        docker run --rm -v $(pwd)/nginx:/etc/nginx:ro nginx:alpine nginx -t

    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: qilema/nginx:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: BUILDKIT_INLINE_CACHE=1
        provenance: mode=max
        sbom: true

    - name: Run Docker Scout vulnerability scan
      uses: docker/scout-action@v1
      if: github.event_name != 'pull_request'
      with:
        image: ${{ steps.docker_build.outputs.imageid }}
        only-severities: critical,high
        write-comment: true
        exit-code: warning

    - name: Generate SBOM (SPDX format)
      uses: docker/scout-action@v1
      if: github.event_name != 'pull_request'
      with:
        command: sbom
        image: ${{ steps.docker_build.outputs.imageid }}
        format: spdx-json
        output: sbom.json

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        name: sbom-backend
        path: sbom.json
        retention-days: 30

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.docker_build.outputs.imageid }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
        ignore-unfixed: true

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

    - name: Generate vulnerability report
      if: failure()
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.docker_build.outputs.imageid }}
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
