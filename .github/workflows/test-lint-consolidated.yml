name: Tests and Lint (Consolidated)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - run: |
          pip install pre-commit
          pre-commit install-hooks
          pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qilema
          POSTGRES_PASSWORD: qilema_test_password
          POSTGRES_DB: qilema_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio pytest-mock pytest-env
      - run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          SECRET_KEY: test_secret_key_at_least_64_bytes_long_for_testing_purposes_only
          DATABASE_URL: postgresql://qilema:qilema_test_password@localhost:5432/qilema_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend-${{ matrix.python-version }}
          fail_ci_if_error: false

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check lockfile exists
        id: check-lockfile
        run: |
          if [ -f "mobile/pnpm-lock.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: pnpm/action-setup@v3
        if: steps.check-lockfile.outputs.exists == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v6
        if: steps.check-lockfile.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.check-lockfile.outputs.exists == 'true'
        run: cd mobile && pnpm install
      - name: Lint
        if: steps.check-lockfile.outputs.exists == 'true'
        run: cd mobile/client && pnpm lint
      - name: Type check
        if: steps.check-lockfile.outputs.exists == 'true'
        run: cd mobile/client && pnpm tsc --noEmit
      - name: Run tests
        if: steps.check-lockfile.outputs.exists == 'true'
        run: cd mobile/client && pnpm test --coverage --run
      - name: Upload coverage
        if: steps.check-lockfile.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./mobile/client/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  docker-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate docker-compose configs
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.dev.yml config > /dev/null
          docker-compose -f docker-compose.yml -f docker-compose.staging.yml config > /dev/null
          docker-compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
      - name: Validate nginx config
        run: docker run --rm -v $(pwd)/nginx:/etc/nginx:ro nginx:alpine nginx -t
      - name: Build backend (amd64 only for PR)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          tags: qilema-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build nginx (amd64 only for PR)
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          platforms: linux/amd64
          push: false
          tags: qilema-nginx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose health check test
        run: |
          docker-compose -f docker-compose.yml up -d postgres redis backend
          sleep 15
          
          # Check all services are healthy
          echo "Checking postgres..."
          docker-compose exec -T postgres pg_isready -U qilema || exit 1
          
          echo "Checking redis..."
          docker-compose exec -T redis redis-cli ping || exit 1
          
          echo "Checking backend..."
          docker-compose exec -T backend curl -f http://localhost:8000/health || exit 1
          
          echo "✅ All services healthy"
          docker-compose down -v
      - name: Test database migrations
        run: |
          docker-compose -f docker-compose.yml up -d postgres
          sleep 5
          docker-compose exec -T postgres psql -U qilema -d qilema -c "SELECT version();" || exit 1
          echo "✅ Database accessible"
          docker-compose down -v

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd backend
          pip install safety
          safety check -r requirements.txt --json > safety-report.json || true
          cat safety-report.json
