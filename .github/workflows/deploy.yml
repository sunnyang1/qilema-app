name: Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.api.qilema.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # 这里可以添加实际的部署命令
        # 例如: kubectl apply -f k8s/staging/
        # 或: ansible-playbook deploy.yml --limit staging

    - name: Run database migrations
      run: |
        echo "Running database migrations..."
        # python scripts/migrate.py --env staging

    - name: Health check
      run: |
        echo "Performing health check..."
        # curl -f https://staging.api.qilema.com/health || exit 1

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.qilema.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Create database backup
      run: |
        echo "Creating database backup before deployment..."
        # aws s3 cp s3://qilema-backups/latest.sql s3://qilema-backups/pre-deploy-$(date +%Y%m%d_%H%M%S).sql

    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # 这里可以添加实际的部署命令
        # 例如: kubectl apply -f k8s/production/
        # 或: ansible-playbook deploy.yml --limit production

    - name: Run database migrations
      run: |
        echo "Running database migrations..."
        # python scripts/migrate.py --env production

    - name: Health check
      run: |
        echo "Performing health check..."
        # curl -f https://api.qilema.com/health || exit 1

    - name: Create post-deployment backup
      run: |
        echo "Creating post-deployment backup..."
        # aws s3 cp s3://qilema-backups/latest.sql s3://qilema-backups/post-deploy-$(date +%Y%m%d_%H%M%S).sql

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  rollback-production:
    if: failure() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Rollback production
      run: |
        echo "Rolling back production environment..."
        # 这里可以添加回滚命令
        # 例如: helm rollback qilema
        # 或: kubectl rollout undo deployment/qilema

    - name: Restore database
      run: |
        echo "Restoring database from backup..."
        # aws s3 cp s3://qilema-backups/pre-deploy-$(ls -t s3://qilema-backups/ | head -1) - | psql $DATABASE_URL

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: 'failure'
        text: 'Production rollback initiated'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
