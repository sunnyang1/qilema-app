name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/qilema-backend
  NGINX_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/qilema-nginx

jobs:
  determine-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.target }}
      version: ${{ steps.env.outputs.version }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "target=production" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "version=main" >> $GITHUB_OUTPUT
          fi

  pre-deploy:
    runs-on: ubuntu-latest
    needs: determine-env
    timeout-minutes: 15
    outputs:
      backup-id: ${{ steps.backup.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_HOST }}

      - name: Create backup
        id: backup
        if: needs.determine-env.outputs.environment == 'production'
        run: |
          BACKUP_ID=$(date +%Y%m%d_%H%M%S)
          echo "id=$BACKUP_ID" >> $GITHUB_OUTPUT
          
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e
          BACKUP_PATH="/backups/pre-deploy-${{ steps.backup.outputs.id }}"
          mkdir -p $BACKUP_PATH
          cd ${{ secrets.APP_PATH }}
          docker compose exec -T postgres pg_dump -U qilema qilema_prod | gzip > $BACKUP_PATH/db.sql.gz
          echo "✅ Backup created"
          EOF

  deploy:
    runs-on: ubuntu-latest
    needs: [determine-env, pre-deploy]
    environment:
      name: ${{ needs.determine-env.outputs.environment }}
      url: ${{ needs.determine-env.outputs.environment == 'staging' && 'https://staging.api.qilema.com' || 'https://api.qilema.com' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_HOST }}

      - name: Deploy
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e
          
          ENV=${{ needs.determine-env.outputs.environment }}
          VERSION=${{ needs.determine-env.outputs.version }}
          
          echo "🚀 Deploying $VERSION to $ENV"
          cd ${{ secrets.APP_PATH }}
          
          # Update code
          git fetch origin
          if [ "$ENV" = "staging" ]; then
            git checkout origin/main
          else
            git checkout $VERSION
          fi
          
          # Pull images
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          
          # Start DB first
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres redis
          sleep 5
          
          # Run migrations
          docker compose exec -T backend python -m alembic upgrade head || true
          
          # Deploy app
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d backend nginx
          
          # Health check
          sleep 10
          for i in {1..30}; do
            if docker compose exec -T backend curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Deployed successfully"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          docker system prune -f
          EOF

      - name: Smoke test
        run: |
          URL=${{ needs.determine-env.outputs.environment == 'staging' && 'https://staging.api.qilema.com' || 'https://api.qilema.com' }}
          curl -f $URL/health || exit 1
          echo "✅ Smoke test passed"

  rollback:
    runs-on: ubuntu-latest
    needs: [determine-env, pre-deploy, deploy]
    if: failure() && needs.determine-env.outputs.environment == 'production'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_HOST }}

      - name: Rollback
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e
          BACKUP_PATH="/backups/pre-deploy-${{ needs.pre-deploy.outputs.backup-id }}"
          cd ${{ secrets.APP_PATH }}
          
          docker compose down || true
          gunzip < $BACKUP_PATH/db.sql.gz | docker compose exec -T postgres psql -U qilema || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          
          sleep 10
          for i in {1..30}; do
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful"
              break
            fi
            sleep 2
          done
          EOF
