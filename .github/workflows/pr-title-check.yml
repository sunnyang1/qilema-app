# PR Title Check - 验证 PR 标题格式
name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Check PR title format
      uses: actions/github-script@v8
      with:
        script: |
          const title = context.payload.pull_request.title;

          // 定义允许的 PR 标题前缀
          const allowedPrefixes = [
            'feat:',
            'fix:',
            'docs:',
            'style:',
            'refactor:',
            'perf:',
            'test:',
            'chore:',
            'ci:',
            'build:',
            'revert:',
            'security:'
          ];

          // 检查标题是否符合约定式提交规范
          const hasValidPrefix = allowedPrefixes.some(prefix =>
            title.toLowerCase().startsWith(prefix)
          );

          if (!hasValidPrefix) {
            const message = [
              'PR 标题不符合规范。',
              '',
              `当前标题: "${title}"`,
              '',
              '请使用以下前缀之一:',
              '- feat: 新功能',
              '- fix: 修复',
              '- docs: 文档',
              '- style: 代码格式',
              '- refactor: 重构',
              '- perf: 性能优化',
              '- test: 测试',
              '- chore: 构建/工具',
              '- ci: CI/CD',
              '- build: 构建系统',
              '- revert: 回滚',
              '- security: 安全修复',
              '',
              '示例: "feat: 添加用户登录功能"'
            ].join('\n');

            core.setFailed(message);
          } else {
            console.log('PR 标题格式正确');
          }

    - name: Check PR description
      uses: actions/github-script@v8
      with:
        script: |
          const body = context.payload.pull_request.body || '';

          // 检查 PR 描述是否为空或过于简单
          if (body.trim().length < 10) {
            core.warning('PR 描述过于简单，建议添加更多上下文信息');
          } else {
            console.log('PR 描述已填写');
          }
